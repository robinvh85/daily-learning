name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Firebase emulators (backend + firestore.rules tests) need Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Backend handlers and firestore.rules against the Auth + Firestore emulators.
      - run: npm run test:emulator

      # Validate lessons and dictionary (fails on tokens missing from the dictionary), then build
      # the site exactly as it is deployed.
      - run: npm run content:check
      - run: npm run build
