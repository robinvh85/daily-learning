lemma: to
ipa_us: /tuː/
cefr: A1
oxford3000: true
senses:
  - key: direction
    pos: preposition
    vi: 'đến, tới (một nơi)'
    en: in the direction of a place
    collocations: [go to school, the train to Oxford]
    example: Which platform does the train to Oxford leave from?
  - key: infinitive
    pos: infinitive marker
    vi: '(đứng trước động từ nguyên mẫu, thường không dịch)'
    en: used before the base form of a verb
    collocations: [want to, need to, try to]
    example: Now she wants to run her own business.
  - key: recipient
    pos: preposition
    vi: với, cho (ai)
    en: used to show who receives something or who an action is directed at
    collocations: [introduce someone to someone, give something to someone, talk to someone]
    example: Please give this letter to your teacher.
status: draft
