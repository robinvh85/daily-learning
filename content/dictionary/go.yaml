lemma: go
ipa_us: /ɡoʊ/
cefr: A1
oxford3000: true
forms: [goes, went, gone, going]
senses:
  - key: go
    pos: verb
    vi: 'đi, đến (một nơi)'
    en: to move or travel to a place
    collocations: [go there, go to work, go home]
    example: I usually go there on Saturday mornings.
  - key: future
    pos: verb
    vi: (be going to + động từ) sẽ, định (làm gì)
    en: used in “be going to” to talk about plans or things that will happen
    collocations: [be going to do something]
    example: It’s going to be hot tomorrow.
status: draft
