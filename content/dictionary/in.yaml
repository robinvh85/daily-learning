lemma: in
ipa_us: /ɪn/
cefr: A1
oxford3000: true
senses:
  - key: in
    pos: preposition
    vi: 'trong, ở (một nơi)'
    en: 'inside a place, or at a place'
    collocations: [in a hotel, in the city]
    example: She worked in a hotel for five years.
  - key: time
    pos: preposition
    vi: trong (khoảng thời gian); sau (in three days = sau ba ngày)
    en: during a period of time; after a particular length of time
    collocations: [in winter, in three days, in the morning]
    example: The train leaves in ten minutes.
  - key: size
    pos: preposition
    vi: (có) cỡ…, màu… (in a large = cỡ L)
    en: used to talk about the size or color of something you can buy
    collocations: [in a large, in small and medium, in blue]
    example: Do you have this shirt in a medium?
status: reviewed
