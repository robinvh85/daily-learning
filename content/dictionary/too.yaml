lemma: too
ipa_us: /tuː/
cefr: A1
oxford3000: true
senses:
  - key: too
    pos: adverb
    vi: quá
    en: more than is good or necessary
    collocations: [too much, too long, too busy]
    example: This coffee is too hot to drink.
  - key: also
    pos: adverb
    vi: cũng (đứng cuối câu)
    en: also; in addition
    collocations: [me too, you too]
    example: 'I like tea, and my sister likes it too.'
status: reviewed
