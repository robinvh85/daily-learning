lemma: spend
ipa_us: /spend/
cefr: A2
oxford3000: true
forms: [spends, spent, spending]
senses:
  - key: time
    pos: verb
    vi: dành, dùng (thời gian vào việc gì)
    en: to use time doing something
    collocations: [spend time on something, spend the weekend at home]
    example: I spend a lot of time on the train every day.
  - key: money
    pos: verb
    vi: tiêu, chi (tiền)
    en: to give money to pay for things
    collocations: [spend money on something, spend too much]
    example: How much do you spend on food each month?
status: reviewed
