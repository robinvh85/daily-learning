lemma: so
ipa_us: /soʊ/
cefr: A1
oxford3000: true
senses:
  - key: so
    pos: conjunction
    vi: nên, vì vậy, vì thế
    en: used to show the result of something
    collocations: [so I decided…, so we stayed home]
    example: It was raining, so we took a taxi.
  - key: very
    pos: adverb
    vi: rất, quá (thank you so much = cảm ơn rất nhiều)
    en: very; very much
    collocations: [so much, so happy, thank you so much]
    example: I’m so happy to see you again!
  - key: that
    pos: adverb
    vi: 'như vậy, vậy (I hope so = mình mong là vậy; I think so = mình nghĩ vậy)'
    en: used after some verbs instead of repeating what was just said
    collocations: [I hope so, I think so, I don't think so]
    example: “Is the shop open today?” “I think so.”
status: reviewed
