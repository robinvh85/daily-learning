lemma: by
ipa_us: /baɪ/
cefr: A1
oxford3000: true
senses:
  - key: near
    pos: preposition
    vi: 'cạnh, bên cạnh'
    en: next to; near
    collocations: [by the window, by the door]
    example: There are six tables by the window.
  - key: means
    pos: preposition
    vi: bằng (phương tiện)
    en: used to say how you travel or how something is done
    collocations: [by bus, by train, by car]
    example: I go to work by bus.
  - key: deadline
    pos: preposition
    vi: trước, chậm nhất là (một thời điểm)
    en: not later than a particular time
    collocations: [by Friday, by five o’clock, by tomorrow]
    example: Please send me the report by Friday.
status: reviewed
