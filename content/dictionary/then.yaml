lemma: then
ipa_us: /ðen/
cefr: A1
oxford3000: true
senses:
  - key: then
    pos: adverb
    vi: sau đó, rồi
    en: after that; next
    collocations: [and then, first… then…]
    example: We had dinner, and then we watched a movie.
  - key: in_that_case
    pos: adverb
    vi: vậy thì, thế thì
    en: used to show that something follows from what was just said
    collocations: [then I’ll…, OK then]
    example: “The bus is late.” “Then let’s take a taxi.”
status: reviewed
