lemma: take
ipa_us: /teɪk/
cefr: A1
oxford3000: true
forms: [takes, took, taken, taking]
senses:
  - key: hold
    pos: verb
    vi: 'cầm, lấy, mang theo'
    en: to get something into your hands; to carry something with you
    collocations: [take an umbrella, take a book]
    example: Take an umbrella with you.
  - key: time
    pos: verb
    vi: mất (bao nhiêu thời gian)
    en: to need a particular amount of time
    collocations: [take fifty minutes, how long does it take]
    example: The 10:15 only takes fifty minutes.
  - key: transport
    pos: verb
    vi: đi (xe buýt, tàu, taxi…)
    en: to use a bus, train, taxi, etc. to travel somewhere
    collocations: [take the bus, take a taxi, take the train]
    example: I usually take the train to work.
  - key: test
    pos: verb
    vi: 'làm, dự (bài kiểm tra, kỳ thi); học (một lớp, khóa học)'
    en: to do a test or exam; to study a course or class
    collocations: [take a test, take an exam, take a class]
    example: I’m going to take my driving test next week.
status: reviewed
