oxford3000: true
senses:
  - key: afraid
    pos: adjective
    vi: 'sợ, ngại (afraid of + V-ing / afraid to + V: sợ làm gì)'
    en: feeling fear, or worried that something bad will happen
    collocations: [afraid of dogs, afraid to ask, afraid of making mistakes]
