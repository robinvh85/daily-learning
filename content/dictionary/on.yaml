lemma: 'on'
ipa_us: /ɑːn/
cefr: A1
oxford3000: true
senses:
  - key: place
    pos: preposition
    vi: 'trên, ở trên; ở (trên một con phố)'
    en: touching the surface of something; located in a street
    collocations: [on the table, on my street]
    example: 'Last week, a small coffee shop opened on my street.'
  - key: day
    pos: preposition
    vi: 'vào (ngày, thứ trong tuần)'
    en: used to say which day something happens
    collocations: [on Monday, on Saturday mornings, on my birthday]
    example: I usually go there on Saturday mornings.
  - key: group
    pos: preposition
    vi: trong (một nhóm, một đội)
    en: being a member of a team or group
    collocations: [on the team, on the staff]
    example: There are two new people on our team.
  - key: activity
    pos: preposition
    vi: vào, cho (việc gì) (spend money/time on…)
    en: used after “spend” to say what money or time is used for
    collocations: [spend money on food, spend time on your phone]
    example: We spend a lot of money on food every month.
  - key: task
    pos: preposition
    vi: '(làm) về, (làm) phần việc gì (work on something)'
    en: used to say what work or project someone is doing
    collocations: [work on a project, work on a report]
    example: She is working on a new book.
status: draft
