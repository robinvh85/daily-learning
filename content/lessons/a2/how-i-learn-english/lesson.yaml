    match: studied … couldn't speak
    note: 'Quá khứ đơn (ngày 2) và could – khả năng trong quá khứ (ngày 9).'
  - point: review-days-1-14
    segment: p2s1
    match: much time
    note: 'much + danh từ không đếm được (ngày 3).'
  - point: review-days-1-14
    segment: p3s1
    match: biggest
    note: 'So sánh nhất (ngày 11).'
  - point: review-days-1-14
