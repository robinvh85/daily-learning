# Reading lesson. Text, translation, focus words and questions come from the UI mockup.
# One segment per sentence; `paragraph` groups sentences into paragraphs (1-based).
kind: reading
level: A2
topic: daily-life
title: A New Coffee Shop
order: 1

segments:
  - id: p1s1
    paragraph: 1
    text_en: Last week, a small coffee shop opened on my street.
    text_vi: Tuần trước, một quán cà phê nhỏ đã khai trương trên phố nhà tôi.
  - id: p1s2
    paragraph: 1
    text_en: It is next to the bakery and across from the bus stop.
    text_vi: Quán nằm cạnh tiệm bánh và đối diện trạm xe buýt.
  - id: p1s3
    paragraph: 1
    text_en: The owner is a young woman called Lan.
    text_vi: Chủ quán là một cô gái trẻ tên Lan.
  - id: p1s4
    paragraph: 1
    text_en: She worked in a hotel for five years, and now she wants to run her own business.
    text_vi: Cô làm ở khách sạn năm năm, và giờ cô muốn tự kinh doanh.
  - id: p2s1
    paragraph: 2
    text_en: The shop is not very big, but it is bright and comfortable.
    text_vi: Quán không lớn lắm nhưng sáng sủa và thoải mái.
  - id: p2s2
    paragraph: 2
    text_en: There are six tables by the window and a long shelf with books.
    text_vi: Có sáu bàn cạnh cửa sổ và một kệ sách dài.
  - id: p2s3
    paragraph: 2
    text_en: Customers can borrow a book and bring it back later.
    text_vi: Khách có thể mượn sách và trả lại sau.
  - id: p3s1
    paragraph: 3
    text_en: I usually go there on Saturday mornings.
    text_vi: Tôi thường đến đó vào sáng thứ Bảy.
  - id: p3s2
    paragraph: 3
    text_en: I order a hot coffee with milk and sometimes a piece of banana cake.
    text_vi: Tôi gọi một ly cà phê sữa nóng và đôi khi một miếng bánh chuối.
  - id: p3s3
    paragraph: 3
    text_en: The prices are reasonable, and the staff are always friendly.
    text_vi: Giá cả hợp lý và nhân viên luôn thân thiện.
  - id: p3s4
    paragraph: 3
    text_en: Lan remembers the names of her regular customers.
    text_vi: Lan nhớ tên những khách quen của mình.
  - id: p4s1
    paragraph: 4
    text_en: For me, the best thing about the shop is the quiet atmosphere.
    text_vi: Với tôi, điều tuyệt nhất ở quán là bầu không khí yên tĩnh.
  - id: p4s2
    paragraph: 4
    text_en: I can sit for an hour, read the news, and plan my week.
    text_vi: Tôi có thể ngồi cả tiếng, đọc tin tức và lên kế hoạch cho tuần.

focus_words: [open, owner, run, comfortable, borrow, reasonable, regular, atmosphere]

# Sense per word in this lesson. "word#n" = n-th occurrence of that word in the lesson.
senses:
  in: in
  last: previous
  open: business
  be#1: location # "It is next to the bakery"
  on#2: day # "on Saturday mornings" (#1 "on my street" keeps the first sense)
  call: name
  for: duration
  for#2: opinion # "For me, …"
  to: infinitive
  run: manage
  by: near
  about: topic
  plan: verb
  work: work
  go: go

ignore: [Lan]

questions:
  - prompt: Where is the coffee shop?
    options: [Next to the bus stop, Next to the bakery, Inside a hotel]
    correct: 1
    feedback_ok: 'Đúng: “It is next to the bakery…”'
    feedback_wrong: Chưa đúng. Đọc lại câu thứ hai của đoạn 1.
    evidence: p1s2
  - prompt: What can customers do with the books?
    options: [Buy them, Borrow them, Write in them]
    correct: 1
    feedback_ok: 'Đúng: “Customers can borrow a book…”'
    feedback_wrong: Chưa đúng. Xem lại câu cuối đoạn 2.
    evidence: p2s3
  - prompt: What does the writer like most about the shop?
    options: [The quiet atmosphere, The cheap cake, The big tables]
    correct: 0
    feedback_ok: 'Đúng: “the best thing … is the quiet atmosphere.”'
    feedback_wrong: Chưa đúng. Tìm cụm “the best thing” ở đoạn 4.
    evidence: p4s1
